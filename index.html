<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>오늘의 리포트 10</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b18; --sub:#6b665d; --line:#e3ddd0; --soft:#efe9dc;
  --up:#d6343c; --up-soft:#fde8e8; --down:#2f63d6; --down-soft:#e5edfd; --keep:#7a756b; --keep-soft:#ece8df;
  --ai:#6a3fd1; --ai-soft:#efe8fd; --robot:#0b8a7a; --robot-soft:#e0f4f1; --fav:#b7791f; --fav-soft:#fbf0d9;
  --accent:#1d1b18;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --card:#1e1c19; --ink:#f1ede4; --sub:#a39d91; --line:#34302a; --soft:#2a2722;
    --up:#ff5c63; --up-soft:#3a1c1e; --down:#6b9bff; --down-soft:#1a2440; --keep:#a8a296; --keep-soft:#2c2925;
    --ai:#a888ff; --ai-soft:#2a2140; --robot:#3fcab6; --robot-soft:#16332f; --fav:#f0b24a; --fav-soft:#3a2d16;
    --accent:#f1ede4;
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --card:#1e1c19; --ink:#f1ede4; --sub:#a39d91; --line:#34302a; --soft:#2a2722;
  --up:#ff5c63; --up-soft:#3a1c1e; --down:#6b9bff; --down-soft:#1a2440; --keep:#a8a296; --keep-soft:#2c2925;
  --ai:#a888ff; --ai-soft:#2a2140; --robot:#3fcab6; --robot-soft:#16332f; --fav:#f0b24a; --fav-soft:#3a2d16;
  --accent:#f1ede4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%;font-size:15px;line-height:1.5;overflow-x:hidden}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* 상단 바 */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.brand{font-weight:800;font-size:16px;letter-spacing:-.3px;flex:1}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer}
.ib:disabled{opacity:.35}
.tools{margin-top:8px}
.tools input{flex:1;min-width:0;height:38px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;font-size:16px}
#dateIn{flex:0 0 132px}
.hint{font-size:12px;color:var(--sub);margin-top:6px;min-height:18px}
.hint b{color:var(--ink)}
#results{display:none;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:46vh;overflow:auto}
#results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer}
#results button:last-child{border-bottom:0}
#results small{color:var(--sub)}

/* 카드 넘기기 */
#deck{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:12px 16px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;min-height:calc(100svh - 200px);display:flex;flex-direction:column}
.card .body{flex:1}
.src{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--sub)}
nav.pager{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:250px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.pg{font-size:12px;color:var(--sub);min-width:44px;text-align:center}

/* 공통 */
.kicker{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.2px}
h1{font-size:22px;line-height:1.32;margin:6px 0 14px;letter-spacing:-.5px;word-break:keep-all}
h2{font-size:18px;margin:4px 0 12px;letter-spacing:-.3px}
h3{font-size:14px;margin:16px 0 8px;color:var(--sub)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:4px;vertical-align:2px}
.b-AI{background:var(--ai-soft);color:var(--ai)}
.b-로봇{background:var(--robot-soft);color:var(--robot)}
.b-즐겨찾기,.b-보유{background:var(--fav-soft);color:var(--fav)}
.up{color:var(--up)} .down{color:var(--down)} .keep{color:var(--keep)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.chip.up{background:var(--up-soft)} .chip.down{background:var(--down-soft)} .chip.keep,.chip.new,.chip.none{background:var(--keep-soft);color:var(--keep)}

/* 표지 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--sub)}
.stat .v{font-size:15px;font-weight:700;margin-top:2px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .n{width:18px;color:var(--sub);font-size:12px}
.list .nm{font-weight:700;flex:0 0 auto}
.list .sb{color:var(--sub);font-size:12.5px;flex:1;text-align:right;word-break:keep-all}
.tap{cursor:pointer}

/* 업종 지도 */
.sec{margin-bottom:12px}
.sec>.t{font-weight:800;font-size:14px;padding:4px 0;border-bottom:2px solid var(--ink);margin-bottom:6px}
.subt{font-size:12px;color:var(--sub);margin:6px 0 2px}
.ent{padding:4px 0 6px 10px;border-left:2px solid var(--line);margin-left:2px}
.ent b{font-size:14px}
.ent p{margin:1px 0 0;font-size:13px;color:var(--sub);word-break:keep-all}

/* 투자의견 한눈에 */
.op{padding:8px 0;border-bottom:1px solid var(--line)}
.op:last-child{border-bottom:0}
.op .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.op .nm{font-weight:700}
.op .meta{font-size:12.5px;color:var(--sub);text-align:right}
.bar{height:10px;background:var(--soft);border-radius:5px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--up);border-radius:5px}
.bar i.neg{background:var(--down)}
.op .pct{font-size:12.5px;font-weight:700}

/* 종목 카드 */
.path{font-size:12px;color:var(--sub)}
.sname{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:2px 0 0}
.sname small{font-size:13px;color:var(--sub);font-weight:600;margin-left:6px}
.rep{margin:8px 0 12px;font-size:13.5px}
.rep .br{font-weight:700}
.rep .ti{color:var(--sub)}
.pricebox{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pricebox .stat .v{font-size:16px}
.pricebox .stat .d{font-size:12px;margin-top:2px}
.about{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;word-break:keep-all}
.about p{margin:0}
.about p+p{margin-top:4px}
ol.pts{margin:0;padding-left:20px}
ol.pts li{margin:6px 0;font-size:14px;word-break:keep-all}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.met{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.met .l{font-size:11px;color:var(--sub)}
.met .v{font-weight:800;font-size:14px;margin-top:2px;word-break:keep-all}
.check{margin-top:12px;background:var(--down-soft);border-radius:10px;padding:9px 12px;font-size:13.5px;word-break:keep-all}
.check b{color:var(--down)}

/* 총정리 */
.sig{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sig:last-of-type{border-bottom:0}
.sig .k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sig b{display:block;margin-bottom:2px}
.sig p{margin:0;font-size:13.5px;color:var(--sub);word-break:keep-all}
.so{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.so:last-child{border-bottom:0}
.empty{padding:40px 8px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand">오늘의 리포트 10</div>
    <button class="ib" id="prevDay" aria-label="이전 날짜">◀</button>
    <button class="ib" id="nextDay" aria-label="다음 날짜">▶</button>
    <button class="ib" id="theme" aria-label="화면 테마">◐</button>
  </div>
  <div class="row tools">
    <input id="dateIn" type="text" inputmode="numeric" enterkeyhint="go" placeholder="2026-11-19" autocomplete="off" aria-label="날짜 (입력 후 엔터)">
    <input id="q" type="search" enterkeyhint="search" placeholder="종목명·코드 검색 (엔터)" autocomplete="off" aria-label="종목 검색">
  </div>
  <div class="hint" id="hint"></div>
  <div id="results"></div>
</header>
<main id="deck" aria-live="polite"></main>
<nav class="pager">
  <button class="ib" id="prevCard" aria-label="이전 카드">‹</button>
  <div class="dots" id="dots"></div>
  <span class="pg num" id="pg"></span>
  <button class="ib" id="nextCard" aria-label="다음 카드">›</button>
</nav>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => n == null ? "-" : Number(n).toLocaleString("ko-KR") + "원";
const md = d => { const [y, m, dd] = d.split("-"); return `${+m}/${+dd}`; };
const DIR = {up: ["상향", "up", "▲"], down: ["하향", "down", "▼"], keep: ["유지", "keep", "="], new: ["신규", "new", "★"], none: ["없음", "none", ""]};
let INDEX = {days: []}, DAY = null, CUR = 0;

// 테마 (이 기기에만 저장)
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const nx = now === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nx;
  try { localStorage.setItem("theme", nx); } catch (e) {}
};

const getJSON = async u => { const r = await fetch(u + (u.includes("?") ? "&" : "?") + "v=" + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); };

function badges(s){ return (s.badges || []).map(b => `<span class="badge b-${esc(b)}">${esc(b)}</span>`).join(""); }
function tchip(s){
  const [t, c, a] = DIR[s.targetDir] || DIR.none;
  return `<span class="chip ${c}">${a ? a + " " : ""}${t}</span>`;
}
function brokers(d){ const b = [...new Set(d.stocks.map(s => s.broker))]; return b.length > 2 ? `${b.slice(0, 2).join("·")} 등 ${b.length}개 증권사` : b.join("·"); }
const src = (who, date) => `<div class="src">출처: ${esc(who)} 리포트(${esc(date)}) 요약 · 투자 권유가 아닙니다</div>`;
const card = (inner, who, date) => `<section class="slide"><div class="card"><div class="body">${inner}</div>${src(who, date)}</div></section>`;

function coverCard(d){
  const o = d.counts.opinion, t = d.counts.target;
  const opTxt = ["BUY", "HOLD", "SELL", "NR"].filter(k => o[k]).map(k => `${k === "NR" ? "의견없음" : k} ${o[k]}`).join(" · ");
  const items = d.stocks.map((s, i) => `<li class="tap" data-go="${i + 3}"><span class="n num">${i + 1}</span><span class="nm">${esc(s.name)}</span>${badges(s)}<span class="sb">${esc(s.sector)} › ${esc(s.sub)}</span></li>`).join("");
  return card(`
    <div class="kicker">${esc(d.date)} · 오늘 나온 종목 리포트 ${d.totalReports}건 중 10종목</div>
    <h1>${esc(d.headline)}</h1>
    <div class="stats">
      <div class="stat"><div class="l">투자의견</div><div class="v num">${esc(opTxt)}</div></div>
      <div class="stat"><div class="l">목표가 변경</div><div class="v num"><span class="up">상향 ${t.up}</span> · <span class="keep">유지 ${t.keep}</span> · <span class="down">하향 ${t.down}</span></div>
        ${t.new || t.none ? `<div class="l">신규 ${t.new} · 목표가 없음 ${t.none}</div>` : ""}</div>
      <div class="stat" style="grid-column:1/-1"><div class="l">기준일 (현재가 = 전일 종가)</div><div class="v num">${esc(d.basis)} 종가</div></div>
    </div>
    <h3>오늘의 10종목</h3>
    <ul class="list">${items}</ul>`, brokers(d), d.date);
}

function mapCard(d){
  const tree = new Map();
  d.stocks.forEach((s, i) => {
    if (!tree.has(s.sector)) tree.set(s.sector, new Map());
    const m = tree.get(s.sector);
    if (!m.has(s.sub)) m.set(s.sub, []);
    m.get(s.sub).push([s, i]);
  });
  let html = "";
  for (const [sec, subs] of tree) {
    html += `<div class="sec"><div class="t">${esc(sec)}</div>`;
    for (const [sub, arr] of subs) {
      html += `<div class="subt">${esc(sub)}</div>` + arr.map(([s, i]) => `<div class="ent tap" data-go="${i + 3}"><b>${esc(s.name)}</b> ${badges(s)}<p>${esc(s.line)}</p></div>`).join("");
    }
    html += `</div>`;
  }
  return card(`<div class="kicker">업종 지도</div><h2>업종 › 세부업종 › 종목</h2>${html}`, brokers(d), d.date);
}

function opinionCard(d){
  const rows = d.stocks.map((s, i) => [s, i]).sort((a, b) => (b[0].upside ?? -1e9) - (a[0].upside ?? -1e9));
  const max = Math.max(10, ...rows.map(([s]) => Math.abs(s.upside || 0)));
  const html = rows.map(([s, i]) => {
    const u = s.upside;
    const tp = s.target ? `${won(s.target)} ${tchip(s)}${s.targetPrev && s.targetPrev !== s.target ? `<br><span class="num">(기존 ${won(s.targetPrev)})</span>` : ""}` : "목표가 없음";
    return `<div class="op tap" data-go="${i + 3}">
      <div class="top"><span><span class="nm">${esc(s.name)}</span> <span class="chip none">${esc(s.opinion === "NR" ? "의견없음" : s.opinion)}</span></span>
        <span class="meta num">${tp}</span></div>
      ${u == null ? `<div class="bar"></div><div class="meta" style="text-align:left">상승여력 계산 불가 (목표가 미제시)</div>` :
        `<div class="bar"><i class="${u < 0 ? "neg" : ""}" style="width:${Math.min(100, Math.abs(u) / max * 100)}%"></i></div>
         <div class="pct num ${u < 0 ? "down" : "up"}">상승여력 ${u > 0 ? "+" : ""}${u}%</div>`}
    </div>`;
  }).join("");
  return card(`<div class="kicker">투자의견 한눈에 · 상승여력 큰 순</div><h2>목표가와 상승여력</h2>${html}`, brokers(d), d.date);
}

function stockCard(s){
  const [t, c, a] = DIR[s.targetDir] || DIR.none;
  const tgt = s.target ? `<div class="v num">${won(s.target)}</div><div class="d ${c} num">${a} ${t}${s.targetPrev && s.targetPrev !== s.target ? ` (기존 ${won(s.targetPrev)})` : ""}</div>` : `<div class="v">미제시</div><div class="d keep">목표가 없음</div>`;
  const up = s.upside == null ? `<div class="v">-</div>` : `<div class="v num ${s.upside < 0 ? "down" : "up"}">${s.upside > 0 ? "+" : ""}${s.upside}%</div>`;
  return card(`
    <div class="path">${esc(s.sector)} › ${esc(s.sub)}</div>
    <div class="sname">${esc(s.name)}<small class="num">${esc(s.code)}</small></div>
    <div style="margin-top:4px">${badges(s)}</div>
    <div class="rep"><span class="br">${esc(s.broker)}</span> · <span class="ti">${esc(s.title)}</span></div>
    <div class="pricebox">
      <div class="stat"><div class="l">투자의견</div><div class="v">${esc(s.opinion === "NR" ? "의견없음" : s.opinion)}</div><div class="d keep">${s.opinionChanged ? "의견 변경" : s.targetDir === "new" ? "신규 제시" : s.opinion === "NR" ? "투자의견 미제시" : "유지"}</div></div>
      <div class="stat"><div class="l">목표주가</div>${tgt}</div>
      <div class="stat"><div class="l">현재가 (전일 종가)</div><div class="v num">${won(s.price)}</div></div>
      <div class="stat"><div class="l">상승여력</div>${up}</div>
    </div>
    <h3>어떤 회사?</h3>
    <div class="about">${s.about.map(x => `<p>${esc(x)}</p>`).join("")}</div>
    <h3>핵심 포인트</h3>
    <ol class="pts">${s.points.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    <h3>핵심 지표</h3>
    <div class="mets">${s.metrics.map(([k, v]) => `<div class="met"><div class="l">${esc(k)}</div><div class="v num">${esc(v)}</div></div>`).join("")}</div>
    <div class="check"><b>체크</b> ${esc(s.risk)}</div>
    <div style="margin-top:10px;font-size:12.5px"><a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--sub)">리포트 원문 보기 ↗</a></div>`, s.broker, s.date);
}

function summaryCard(d){
  const sig = d.signals.map((x, i) => `<div class="sig"><div class="k">${i + 1}</div><div><b>${esc(x.t)}</b><p>${esc(x.d)}</p></div></div>`).join("");
  const so = (d.standouts || []).map(x => {
    const i = d.stocks.findIndex(s => s.code === x.code);
    return `<div class="so ${i >= 0 ? "tap" : ""}" ${i >= 0 ? `data-go="${i + 3}"` : ""}><b>${esc(x.name)}</b> <span class="chip none">${esc(x.tag)}</span><br><span style="color:var(--sub)">${esc(x.note)}</span></div>`;
  }).join("");
  return card(`<div class="kicker">총정리</div><h2>오늘 리포트들의 공통 시그널</h2>${sig}<h3>눈에 띄는 종목</h3>${so}`, brokers(d), d.date);
}

function render(d){
  const deck = $("deck");
  deck.innerHTML = coverCard(d) + mapCard(d) + opinionCard(d) + d.stocks.map(stockCard).join("") + summaryCard(d);
  $("dots").innerHTML = [...deck.children].map(() => "<i></i>").join("");
  deck.scrollLeft = 0; CUR = 0; mark();
}
function mark(){
  const n = $("deck").children.length;
  [...$("dots").children].forEach((x, i) => x.classList.toggle("on", i === CUR));
  $("pg").textContent = n ? `${CUR + 1}/${n}` : "";
  $("prevCard").disabled = CUR <= 0; $("nextCard").disabled = CUR >= n - 1;
}
function go(i){
  const deck = $("deck"), n = deck.children.length;
  const nx = Math.max(0, Math.min(n - 1, i)), far = Math.abs(nx - CUR) > 1;
  CUR = nx;
  deck.scrollTo({left: CUR * deck.clientWidth, behavior: far ? "auto" : "smooth"});
  mark(); window.scrollTo({top: 0});
}
let st;
$("deck").addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(() => { const d = $("deck"); CUR = Math.round(d.scrollLeft / d.clientWidth); mark(); }, 60); });
$("prevCard").onclick = () => go(CUR - 1);
$("nextCard").onclick = () => go(CUR + 1);
$("deck").addEventListener("click", e => { const t = e.target.closest("[data-go]"); if (t && !e.target.closest("a")) go(+t.dataset.go); });
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") go(CUR + 1); if (e.key === "ArrowLeft") go(CUR - 1); });

function hint(h){ $("hint").innerHTML = h; }
function navBtns(){
  const ds = INDEX.days.map(x => x.date), i = ds.indexOf(DAY);
  $("prevDay").disabled = i < 0 || i >= ds.length - 1;   // 목록은 최신순
  $("nextDay").disabled = i <= 0;
}
async function openDay(date, card){
  try {
    const d = await getJSON(`data/${date}.json`);
    DAY = date; $("dateIn").value = date; render(d); navBtns();
    hint(`<b>${esc(date)}</b> 정리 · 저장된 날짜 ${INDEX.days.length}개 · 카드를 옆으로 넘기세요`);
    if (card != null) setTimeout(() => go(card), 50);
  } catch (e) {
    hint(`${esc(date)} 정리가 없어요 (주말·휴장일이거나 아직 정리 전). 저장된 날짜: ${INDEX.days.slice(0, 5).map(x => x.date).join(", ")}${INDEX.days.length > 5 ? " …" : ""}`);
    $("dateIn").value = DAY || "";
  }
}
// 날짜 입력: 다 입력하고 엔터(또는 다른 곳 탭)했을 때만 실행 → change 이벤트
$("dateIn").addEventListener("change", () => {
  let v = $("dateIn").value.trim().replace(/[./\s]/g, "-");
  if (/^\d{8}$/.test(v)) v = `${v.slice(0, 4)}-${v.slice(4, 6)}-${v.slice(6)}`;
  const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) { hint("날짜는 2026-11-19 처럼 입력하고 엔터를 누르세요."); $("dateIn").value = DAY || ""; return; }
  const iso = `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  if (iso !== DAY) openDay(iso);
});
$("prevDay").onclick = () => { const ds = INDEX.days.map(x => x.date), i = ds.indexOf(DAY); if (i >= 0 && i < ds.length - 1) openDay(ds[i + 1]); };
$("nextDay").onclick = () => { const ds = INDEX.days.map(x => x.date), i = ds.indexOf(DAY); if (i > 0) openDay(ds[i - 1]); };

// 종목 검색: 엔터(또는 다른 곳 탭)했을 때만 실행 → change 이벤트
$("q").addEventListener("change", () => {
  const q = $("q").value.trim().toLowerCase(), box = $("results");
  if (!q) { box.style.display = "none"; box.innerHTML = ""; return; }
  const hits = [];
  for (const day of INDEX.days) day.stocks.forEach(([code, name], i) => { if (code.includes(q) || name.toLowerCase().includes(q)) hits.push({date: day.date, code, name, i}); });
  box.style.display = "block";
  box.innerHTML = hits.length ? hits.slice(0, 50).map(h => `<button data-d="${h.date}" data-i="${h.i}"><b>${esc(h.name)}</b> <small class="num">${esc(h.code)} · ${esc(h.date)}</small></button>`).join("")
    : `<div style="padding:12px;color:var(--sub)">'${esc(q)}' 종목이 들어간 날이 없어요.</div>`;
});
$("results").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("results").style.display = "none";
  openDay(b.dataset.d, +b.dataset.i + 3);
});

(async () => {
  try { INDEX = await getJSON("data/index.json"); } catch (e) { INDEX = {days: []}; }
  if (!INDEX.days.length) { $("deck").innerHTML = `<section class="slide"><div class="card"><div class="empty">아직 정리된 날짜가 없어요.</div></div></section>`; hint(""); return; }
  const want = new URLSearchParams(location.search).get("d");
  openDay(want && INDEX.days.some(x => x.date === want) ? want : INDEX.days[0].date);
})();
</script>
</body>
</html>
